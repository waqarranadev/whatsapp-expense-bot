# Optional: local MongoDB instead of Atlas.
#   docker compose up -d
#   MONGODB_URI=mongodb://localhost:27017/expense_bot
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Enabled later together with the BullMQ queue.
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"

volumes:
  mongo-data:
